# Project-local MCP endpoints for GuardingTheTown.
# Keep these ports in sync with settings/mcp-server.json and
# settings/cya-cocos-creator-mcp.json.

[mcp_servers.guarding_town_cocos]
url = "http://127.0.0.1:3100/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "writes"

[mcp_servers.guarding_town_preview]
url = "http://127.0.0.1:8866/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
