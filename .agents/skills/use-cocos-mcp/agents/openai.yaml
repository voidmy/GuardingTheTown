  short_description: "使用项目内 MCP 安全编辑场景、Prefab、组件与资源"
  default_prompt: "使用 $use-cocos-mcp 检查并操作 GuardingTheTown 当前 Cocos 场景。"

dependencies:
  tools:
    - type: "mcp"
      value: "guarding_town_cocos"
      description: "GuardingTheTown Cocos Editor MCP"
      transport: "streamable_http"
      url: "http://127.0.0.1:3100/mcp"
    - type: "mcp"
      value: "guarding_town_preview"
      description: "GuardingTheTown Cocos Preview MCP"
      transport: "streamable_http"
      url: "http://127.0.0.1:8866/mcp"
